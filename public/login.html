<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login · My LIC Record</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">📋</div>
      <h1>My LIC Record</h1>
      <p>Apna customer &amp; call record, ek jagah</p>
      <form id="loginForm">
        <div class="field" style="text-align:left">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" autofocus required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Login</button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>
  </div>
  <div id="toast"></div>
  <script>
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");

    // If already logged in, skip straight to dashboard
    fetch("/api/me", { credentials: "same-origin" })
      .then((r) => r.json())
      .then((d) => { if (d.authenticated) window.location.href = "/index.html"; })
      .catch(() => {});

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";
      btn.disabled = true;
      btn.textContent = "Checking...";
      try {
        const password = document.getElementById("password").value;
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = "/index.html";
        } else {
          errorBox.textContent = "Galat password. Dobara try karein.";
        }
      } catch (err) {
        errorBox.textContent = "Kuch gadbad ho gayi. Dobara try karein.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
